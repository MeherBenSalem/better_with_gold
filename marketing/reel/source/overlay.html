<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Display; src: url('fonts/cinzel.ttf'); font-weight: 400 900; }
@font-face { font-family: Serif; src: url('fonts/eb-garamond.ttf'); font-weight: 400 800; }
:root { --ink: #0b0806; --gold: #f2c94c; --gold2: #ffe9a3; --gold3: #b8862b; --parch: #f4e6c4; --steel: #9ecbff;
        --blood: #e5534b; --arcane: #b07cff; --heal: #8ee07a; }
html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
* { box-sizing: border-box; }
.layer { position: absolute; inset: 0; }
#vignette { background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(8,5,2,.55) 100%); }
#flash { background: radial-gradient(ellipse at 50% 45%, #fff6dc, #ffe2a0 60%, #f2c94c); opacity: 0; }
#dim { background: radial-gradient(ellipse at 50% 42%, rgba(12,8,4,.45), rgba(8,5,2,.92)); opacity: 0; }
#bars { pointer-events: none; }
#bars::before, #bars::after { content: ''; position: absolute; left: 0; right: 0; height: 0; background: #000; }
#bars::before { top: 0; } #bars::after { bottom: 0; }

/* captions: uppercase, the spoken word in gold (the channel's short-form look, in the mod's colours) */
#cap { position: absolute; left: 70px; right: 70px; top: 1240px; display: flex; flex-wrap: wrap; justify-content: center;
       gap: 0 26px; font-family: Display; font-weight: 900; text-transform: uppercase; text-align: center; line-height: 1.08;
       transform-origin: 50% 50%; }
#cap span { display: inline-block; color: #fffaf0; font-size: 92px; letter-spacing: 1px;
            -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill;
            text-shadow: 0 9px 0 rgba(8,5,2,.7), 0 0 34px rgba(8,5,2,.55); }
#cap span.on { color: var(--gold); text-shadow: 0 9px 0 rgba(8,5,2,.7), 0 0 40px rgba(242,201,76,.75); }
#cap.high { top: 1060px; }
#cap.low { top: 1430px; }

/* feature labels: an icon in a gold diamond, the name, a rule in the class colour, the line under it */
#label { position: absolute; left: 0; right: 0; top: 214px; text-align: center; opacity: 0; }
#lrow { display: inline-flex; align-items: center; gap: 26px; }
#licon { width: 112px; height: 112px; position: relative; flex: none; }
#licon .dia { position: absolute; inset: 10px; transform: rotate(45deg); border-radius: 10px;
              background: linear-gradient(135deg, #3a2a12, #120c06); border: 5px solid var(--gold);
              box-shadow: 0 0 0 4px var(--ink), 0 10px 0 rgba(8,5,2,.6), 0 0 34px rgba(242,201,76,.55); }
#licon img { position: absolute; left: 24px; top: 24px; width: 64px; height: 64px; image-rendering: pixelated; }
#lname { font-family: Display; font-weight: 900; font-size: 104px; line-height: 1.02; letter-spacing: 3px; text-transform: uppercase;
         background: linear-gradient(180deg, #fff8dc 0%, #ffe39a 38%, #f2c94c 62%, #b8862b 100%);
         -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap;
         filter: drop-shadow(0 0 0 var(--ink)) drop-shadow(0 7px 0 rgba(8,5,2,.85)) drop-shadow(0 0 22px rgba(8,5,2,.7)); }
#lname-s { position: absolute; font-family: Display; font-weight: 900; font-size: 104px; line-height: 1.02; letter-spacing: 3px;
           text-transform: uppercase; color: transparent; -webkit-text-stroke: 16px var(--ink); white-space: nowrap; z-index: -1; }
#lbar { width: 520px; height: 8px; margin: 18px auto 14px; border-radius: 4px; transform-origin: 50% 50%; position: relative; }
#lbar::before, #lbar::after { content: ''; position: absolute; top: -7px; width: 22px; height: 22px; transform: rotate(45deg);
           background: var(--gold); border: 4px solid var(--ink); }
#lbar::before { left: -16px; } #lbar::after { right: -16px; }
#lsub { font-family: Serif; font-weight: 800; font-style: normal; font-size: 50px; letter-spacing: 1px; color: var(--parch);
        -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; display: inline-block; white-space: nowrap;
        text-shadow: 0 6px 0 rgba(8,5,2,.7); }
#lsub b { font-weight: 800; }

/* hook word slam */
#hook { position: absolute; left: 0; right: 0; top: 330px; text-align: center; opacity: 0; }
#hook div { font-family: Display; font-weight: 900; font-size: 150px; line-height: .98; letter-spacing: 2px; text-transform: uppercase;
            color: #fffaf0; -webkit-text-stroke: 18px var(--ink); paint-order: stroke fill;
            text-shadow: 0 12px 0 rgba(8,5,2,.75), 0 0 60px rgba(242,201,76,.45); }
#hook div.g { background: linear-gradient(180deg, #fff8dc 0%, #ffe39a 38%, #f2c94c 62%, #b8862b 100%);
              -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0;
              filter: drop-shadow(0 10px 0 rgba(8,5,2,.85)) drop-shadow(0 0 30px rgba(242,201,76,.6)); }

/* title card */
#title { opacity: 0; }
#crest { position: absolute; left: 50%; top: 360px; width: 470px; height: 470px; margin-left: -235px; }
#crest img { width: 100%; height: 100%; border-radius: 56px; filter: drop-shadow(0 18px 0 rgba(8,5,2,.6)) drop-shadow(0 0 70px rgba(242,201,76,.45)); }
#rays { position: absolute; left: 50%; top: 595px; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; opacity: .0;
        background: repeating-conic-gradient(from 0deg, rgba(255,226,150,.16) 0deg 6deg, rgba(255,226,150,0) 6deg 18deg);
        -webkit-mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 30%, transparent 62%);
                mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 30%, transparent 62%); }
#t0 { position: absolute; left: 0; right: 0; top: 900px; text-align: center; font-family: Display; font-weight: 800; font-size: 56px;
      letter-spacing: 22px; color: var(--parch); text-shadow: 0 5px 0 rgba(8,5,2,.85), 0 0 24px rgba(8,5,2,.8); padding-left: 22px; }
#t1 { position: absolute; left: 0; right: 0; top: 968px; text-align: center; font-family: Display; font-weight: 900;
      font-size: 126px; letter-spacing: 3px; line-height: 1;
      background: linear-gradient(180deg, #fffbe6 0%, #ffe39a 36%, #f2c94c 60%, #a8741f 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 10px 0 rgba(8,5,2,.85)) drop-shadow(0 0 40px rgba(242,201,76,.5)); }
#rule { position: absolute; left: 50%; top: 1150px; width: 760px; height: 5px; margin-left: -380px;
        background: linear-gradient(90deg, rgba(242,201,76,0), #f2c94c 18%, #fff1b8 50%, #f2c94c 82%, rgba(242,201,76,0)); }
#rule::after { content: ''; position: absolute; left: 50%; top: -9px; width: 22px; height: 22px; margin-left: -11px;
               transform: rotate(45deg); background: var(--gold); border: 4px solid var(--ink); }
#t2 { position: absolute; left: 0; right: 0; top: 1185px; text-align: center; font-family: Serif; font-weight: 700; font-style: italic;
      font-size: 62px; color: var(--parch); text-shadow: 0 5px 0 rgba(8,5,2,.85); white-space: nowrap; }
#t3 { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font-family: Display; font-weight: 800;
      font-size: 40px; letter-spacing: 8px; color: var(--gold); text-shadow: 0 4px 0 rgba(8,5,2,.85); padding-left: 8px; }
#t4 { position: absolute; left: 0; right: 0; top: 1368px; text-align: center; font-family: Serif; font-weight: 700;
      font-size: 42px; letter-spacing: 1px; color: #e7d9b8; text-shadow: 0 4px 0 rgba(8,5,2,.85); }
#shine { position: absolute; top: 950px; height: 210px; width: 240px; left: -320px;
         background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,250,230,.75), rgba(255,255,255,0));
         mix-blend-mode: overlay; filter: blur(8px); }
#motes { position: absolute; inset: 0; }
.mote { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #ffe7a1;
        box-shadow: 0 0 12px 3px rgba(255,214,110,.75); }

/* the closing question's prompt */
#comment { position: absolute; left: 50%; top: 1520px; display: flex; align-items: center; gap: 22px; white-space: nowrap;
           font-family: Display; font-weight: 900; font-size: 50px; letter-spacing: 4px; color: var(--ink);
           background: linear-gradient(180deg, #ffe9a3, #f2c94c 55%, #c9952f); padding: 22px 44px 20px; border-radius: 16px;
           border: 5px solid var(--ink); opacity: 0; transform-origin: 50% 50%;
           box-shadow: 0 12px 0 rgba(8,5,2,.6), 0 0 50px rgba(242,201,76,.55); }
#comment svg { width: 56px; height: 56px; }
</style></head>
<body>
<div id="vignette" class="layer"></div>
<div id="dim" class="layer"></div>
<div id="motes" class="layer"></div>

<div id="hook"><div id="h1">NEVER</div><div id="h2" class="g">ALONE</div></div>

<div id="label"><div id="lrow"><div id="licon"><div class="dia"></div><img id="limg"></div>
  <div style="position:relative"><div id="lname-s"></div><div id="lname"></div></div></div>
  <div id="lbar"></div><div id="lsub"></div></div>

<div id="title" class="layer">
  <div id="rays"></div>
  <div id="crest"><img src="icon.png"></div>
  <div id="t0">REMNANTS</div>
  <div id="t1">FELLOWSHIP</div>
  <div id="rule"></div>
  <div id="t2">Lead a warband of sellswords</div>
  <div id="t3">FABRIC · FORGE · NEOFORGE</div>
  <div id="t4">Free on Modrinth &amp; CurseForge</div>
  <div id="shine"></div>
</div>

<div id="comment"><span>COMMENT BELOW</span>
  <svg viewBox="0 0 24 24"><path d="M12 3v15m0 0-6-6m6 6 6-6" fill="none" stroke="#0b0806" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>

<div id="cap"></div>
<div id="flash" class="layer"></div>

<script>
const CAPS = __CAPTIONS__;
const C = __CUES__;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const back = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, fi = .15, fo = .15) => clamp((t - a) / fi) * clamp((b - t) / fo);
const $ = id => document.getElementById(id);
const hash = x => { const s = Math.sin(x * 12.9898) * 43758.5453; return s - Math.floor(s); };

// gold motes drifting up behind the title card (deterministic per frame)
const MOTES = Array.from({ length: 34 }, (_, i) => ({ x: hash(i + 1) * 1080, s: 0.5 + hash(i + 7) * 1.1, v: 90 + hash(i + 3) * 160,
                                                   ph: hash(i + 11) * 6.28, y0: 700 + hash(i + 5) * 1300 }));
MOTES.forEach(() => { const d = document.createElement('div'); d.className = 'mote'; $('motes').appendChild(d); });

let lastChunk = -1;
function captions(t) {
  const cap = $('cap');
  const i = CAPS.findIndex(c => t >= c.start - 0.03 && t < c.end);
  if (i < 0) { cap.style.opacity = 0; return; }
  const c = CAPS[i];
  if (i !== lastChunk) {
    cap.innerHTML = c.words.map(w => `<span>${w.text}</span>`).join('');
    // lifted over the player-view shots so the hotbar and party frames stay clear
    // clear of the wheel, the roster panel and the action in the middle of the frame (above the hotbar)
    cap.className = (C.capLow || []).some(([a, b]) => c.start >= a - 0.05 && c.start < b) ? 'low'
                  : C.capHigh.some(([a, b]) => c.start >= a && c.start < b) ? 'high' : '';
    lastChunk = i;
  }
  const spans = cap.querySelectorAll('span');
  c.words.forEach((w, k) => {
    const next = k + 1 < c.words.length ? c.words[k + 1].start : c.end;
    const on = t >= w.start - 0.03 && t < next;
    spans[k].classList.toggle('on', on);
    const p = clamp((t - w.start + 0.03) / 0.12);
    spans[k].style.transform = on ? `scale(${1 + 0.08 * Math.sin(Math.PI * clamp(p))})` : 'scale(1)';
  });
  const pop = back((t - c.start + 0.03) / 0.16);
  cap.style.opacity = clamp((t - c.start + 0.03) / 0.05) * clamp((c.end - t) / 0.06);
  cap.style.transform = `scale(${0.82 + 0.18 * pop})`;
}

let lastLabel = null;
function label(t) {
  const L = C.labels.find(l => t >= l.t0 && t < l.t1);
  const el = $('label');
  if (!L) { el.style.opacity = 0; return 0; }
  if (L !== lastLabel) {
    $('lname').textContent = L.name; $('lname-s').textContent = L.name;
    for (const id of ['lname', 'lname-s']) $(id).style.fontSize = '104px';
    $('limg').src = `icons/icon-${L.icon}.png`;
    const wdt = $('lrow').getBoundingClientRect().width;
    if (wdt > 1000) for (const id of ['lname', 'lname-s']) $(id).style.fontSize = `${Math.floor(104 * (1000 - 138) / (wdt - 138))}px`;
    $('lsub').innerHTML = L.sub;
    $('lbar').style.background = `linear-gradient(90deg, ${L.color}00, ${L.color} 15%, ${L.color} 85%, ${L.color}00)`;
    $('lbar').style.boxShadow = `0 0 22px ${L.color}`;
    lastLabel = L;
  }
  const u = t - L.t0;
  const o = clamp(u / 0.07) * clamp((L.t1 - t) / 0.08);
  el.style.opacity = o;
  $('licon').style.transform = `scale(${0.4 + 0.6 * back(u / 0.22)}) rotate(${(1 - eo(u / 0.3)) * -90}deg)`;
  $('lname').parentElement.style.transform = `translateX(${(1 - eo(u / 0.24)) * 80}px) scale(${0.86 + 0.14 * back(u / 0.24)})`;
  $('lbar').style.transform = `scaleX(${eo((u - 0.06) / 0.26)})`;
  $('lsub').style.opacity = clamp((u - 0.1) / 0.12);
  $('lsub').style.transform = `translateY(${(1 - eo((u - 0.1) / 0.26)) * 20}px)`;
  return o;
}

function hook(t) {
  const [a, b, w2] = C.hook;
  const el = $('hook');
  el.style.opacity = win(t, a, b, 0.03, 0.12);
  const s1 = back((t - a) / 0.2), s2 = back((t - w2) / 0.2);
  $('h1').style.transform = `scale(${1.6 - 0.6 * s1})`;
  $('h1').style.opacity = clamp((t - a) / 0.05);
  $('h2').style.transform = `scale(${1.6 - 0.6 * s2})`;
  $('h2').style.opacity = clamp((t - w2) / 0.05);
}

function title(t) {
  const [T0, T1] = C.title, TW = C.titleWord;
  const to = win(t, T0, T1, 0.12, 0.18);
  $('title').style.opacity = to;
  $('title').style.transform = `scale(${1 + 0.04 * clamp((t - T0) / (T1 - T0))})`;
  $('dim').style.opacity = 0.82 * win(t, T0, T1, 0.2, 0.2);
  const motes = $('motes').children;
  for (let i = 0; i < MOTES.length; i++) {
    const m = MOTES[i], el = motes[i];
    const y = m.y0 - (t - T0) * m.v;
    el.style.opacity = to * (0.35 + 0.65 * Math.abs(Math.sin(t * 2 + m.ph)));
    el.style.transform = `translate(${m.x + Math.sin(t * 1.3 + m.ph) * 20}px, ${y}px) scale(${m.s})`;
  }
  if (to <= 0) return;
  $('crest').style.transform = `scale(${0.5 + 0.5 * back((t - T0 - 0.02) / 0.42)})`;
  $('crest').style.opacity = clamp((t - T0) / 0.12);
  $('rays').style.opacity = 0.9 * clamp((t - T0) / 0.4);
  $('rays').style.transform = `rotate(${(t - T0) * 9}deg)`;
  const p0 = eo((t - TW + 0.25) / 0.45);
  $('t0').style.opacity = clamp((t - TW + 0.3) / 0.15);
  $('t0').style.letterSpacing = `${22 + (1 - p0) * 26}px`;
  const p1 = back((t - TW) / 0.3);
  $('t1').style.opacity = clamp((t - TW + 0.02) / 0.08);
  $('t1').style.transform = `scale(${1.35 - 0.35 * p1})`;
  $('rule').style.transform = `scaleX(${eo((t - TW - 0.12) / 0.5)})`;
  $('t2').style.opacity = clamp((t - TW - 0.25) / 0.25);
  $('t2').style.transform = `translateY(${(1 - eo((t - TW - .25) / .35)) * 26}px)`;
  $('t3').style.opacity = clamp((t - TW - 0.55) / 0.3);
  $('t4').style.opacity = clamp((t - TW - 0.8) / 0.3);
  $('shine').style.left = `${-320 + 1720 * eio((t - TW - 0.35) / 0.9)}px`;
}

function frame(t) {
  let fl = 0;
  for (const [at, peak] of C.flashes) {
    if (t >= at && t < at + 0.3) fl = Math.max(fl, peak * Math.pow(1 - (t - at) / 0.3, 2));
  }
  $('flash').style.opacity = fl;
  label(t);
  hook(t);
  title(t);
  const [ca, cb] = C.comment;
  const cm = $('comment');
  cm.style.opacity = win(t, ca, cb, 0.08, 0.2);
  const cs = 0.5 + 0.5 * back((t - ca) / 0.22);
  cm.style.transform = `translateX(-50%) scale(${cs}) translateY(${Math.sin((t - ca) * 7) * 6 * clamp((t - ca - .25) / .2)}px)`;
  captions(t);
}
window.frame = frame;
</script>
</body></html>
