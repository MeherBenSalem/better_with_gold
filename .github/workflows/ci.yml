# CI for Remnants | Fellowship (NightBeam convention; based on Bosses' publisher-checks.yml).
# Builds all 8 jars (1.20.1 Fabric + Forge; 1.21.1, 26.2, 26.3 Fabric + NeoForge) with ./gradlew buildAll,
# runs each workspace's checks (part of `build`: the core regression suite), checks that every workspace has the
# same version= (and VERSION matches) and that the metadata ranges stay inside their Minecraft line, and runs the
# publisher script tests (the same-day guard). It replaces build.yml, which built each workspace on its own.
# It never publishes anything.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      # Packed into every jar by the workspaces' multiloader-loader.gradle.
      - "shared-resources/**"
      - "scripts/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "VERSION"
      - "releases/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Test publisher scripts (same-day guard)
        run: node --test scripts/*.test.mjs
      - name: Check the 8 targets, one version and metadata ranges
        run: python3 scripts/check_targets.py workspaces

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root build hands 26.x
      # JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all 8 jars and run the checks
        run: |
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon
      - name: Check the 8 jars
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/check_targets.py version)"
          # releases/ holds only what dist just copied (no jars are committed in this repo).
          python3 scripts/check_targets.py jars --version "$version" --dir releases --list-file ci-jars.txt
          mkdir -p ci-jars
          xargs -a ci-jars.txt cp -f -t ci-jars/
          # Each jar carries its loader's metadata, as the upload step expects from its name.
          while IFS= read -r jar; do
            case "$(basename "$jar")" in
              better_with_gold-fabric-*) meta='fabric.mod.json' ;;
              better_with_gold-neoforge-*) meta='META-INF/neoforge.mods.toml' ;;
              better_with_gold-forge-*) meta='META-INF/mods.toml' ;;
            esac
            unzip -l "$jar" | grep " ${meta}\$" >/dev/null || { echo "::error::Missing ${meta} in ${jar}"; exit 1; }
            echo "$jar -> $meta"
          done < ci-jars.txt
      - uses: actions/upload-artifact@v4
        with:
          name: better_with_gold-jars
          path: ci-jars/*.jar
          if-no-files-found: error
