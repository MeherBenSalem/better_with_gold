# Dual-publish NightBeam mods/plugins to Modrinth + CurseForge on version tags.
# Copy to each mod repo as: .github/workflows/publish.yml
#
# Org/repo secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Repo variables:
#   MODRINTH_ID
#   CURSEFORGE_ID
#
# Usage after a release build is ready:
#   git tag v1.2.3 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all workspaces
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          JAVA_HOME_17: ${{ env.JAVA_HOME_17_X64 }}
          JAVA_HOME_21: ${{ env.JAVA_HOME_21_X64 }}
          JAVA_HOME_25: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 2>/dev/null || true
          ./gradlew buildAll --no-daemon

      - name: Find jars
        id: jars
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mapfile -t JARS < <(find all-jars -type f -name "*-${VERSION}.jar" 2>/dev/null | sort)
          if [ ${#JARS[@]} -eq 0 ]; then
            mapfile -t JARS < <(find . -type f -path "*/build/libs/*.jar" \
              -name "*-${VERSION}.jar" \
              ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
              ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" | sort)
          fi
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No release jars for version ${VERSION}" >&2
            exit 1
          fi
          for jar in "${JARS[@]}"; do
            base=$(basename "$jar")
            if [[ ! "$base" =~ ^better_with_gold-(fabric|forge|neoforge)-.+-${VERSION}\.jar$ ]]; then
              echo "Unexpected jar name: $base" >&2
              exit 1
            fi
            if [[ "$base" == *fabric* ]]; then
              unzip -l "$jar" | grep -q ' fabric.mod.json$' || {
                echo "Missing fabric.mod.json in $jar" >&2
                exit 1
              }
            fi
          done
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map((s) => s.trim()).filter(Boolean);
          const LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150 };

          function parseJar(jarPath) {
            const name = path.basename(jarPath);
            const m = name.match(/^better_with_gold-(fabric|forge|neoforge)-(.+)-(\d+\.\d+\.\d+)\.jar$/i);
            if (!m) throw new Error('Cannot parse jar name: ' + name);
            return {
              jar: jarPath,
              name,
              loader: m[1].toLowerCase(),
              game: m[2],
              modVersion: m[3],
            };
          }

          (async () => {
            const parsed = jars.map(parseJar);
            const changelog = `Release ${version}`;

            for (const parsedJar of parsed) {
              const body = {
                name: `${version} · ${parsedJar.loader} · ${parsedJar.game}`,
                version_number: `${version}+${parsedJar.loader}-${parsedJar.game}`,
                changelog,
                dependencies: [],
                game_versions: [parsedJar.game],
                version_type: 'release',
                loaders: [parsedJar.loader],
                featured: false,
                status: 'listed',
                project_id: process.env.MODRINTH_ID,
                file_parts: ['file_0'],
                primary_file: 'file_0',
              };
              const form = new FormData();
              form.append('data', JSON.stringify(body));
              form.append('file_0', new Blob([fs.readFileSync(parsedJar.jar)]), parsedJar.name);
              const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                method: 'POST',
                headers: { Authorization: process.env.MODRINTH_TOKEN },
                body: form,
              });
              const mrText = await mrRes.text();
              if (!mrRes.ok) {
                throw new Error('Modrinth ' + mrRes.status + ' ' + parsedJar.name + ' ' + mrText.slice(0, 500));
              }
              console.log('Modrinth OK', body.version_number, parsedJar.name);
            }

            const legacyPayload = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            }).then((r) => r.json());
            const legacyFlat = Array.isArray(legacyPayload) ? legacyPayload : legacyPayload?.data || [];
            const clientId = legacyFlat.find((v) => v.name === 'Client')?.id;
            const serverId = legacyFlat.find((v) => v.name === 'Server')?.id;
            if (!clientId || !serverId) throw new Error('CurseForge Client/Server version ids missing');

            for (const parsedJar of parsed) {
              const loaderId = LOADER_IDS[parsedJar.loader];
              if (!loaderId) throw new Error('Unknown loader ' + parsedJar.loader);
              const gameHit = legacyFlat.find((v) => v.name === parsedJar.game);
              if (!gameHit) throw new Error('No CurseForge game version for ' + parsedJar.game);
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: `${version} · ${parsedJar.loader} · ${parsedJar.game}`,
                gameVersions: [clientId, serverId, loaderId, gameHit.id],
                releaseType: 'release',
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(parsedJar.jar)]), parsedJar.name);
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) {
                throw new Error('CurseForge ' + cfRes.status + ' ' + parsedJar.name + ' ' + cfText.slice(0, 500));
              }
              console.log('CurseForge OK', meta.displayName, parsedJar.name);
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
