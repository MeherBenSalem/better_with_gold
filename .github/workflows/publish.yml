# Publish Remnants | Fellowship to Modrinth + CurseForge (NightBeam convention).
#
# Runs only by hand (workflow_dispatch) or on a v*.*.* tag; a push to main never releases anything.
# Uses exactly the 8 convention jars for the version, in this order of sources:
#   1. releases/better_with_gold-<loader>-<minecraft>-<version>.jar committed to the repo (none are today),
#   2. the jars attached to the GitHub Release v<version>,
#   3. a build from source: ./gradlew buildAll (the workspaces and VERSION must be at <version>).
# The run fails unless all 8 are found: 1.20.1 Fabric + Forge; 1.21.1, 26.2 and 26.3 Fabric + NeoForge.
# The upload step reads loader + Minecraft version from each jar name, declares Fabric API as a required dependency
# on Fabric, and takes the release notes from patchnotes/<version>.md. (scripts/upload_platforms.mjs is the
# maintainer's local uploader; this workflow does not use it.)
#
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops the run if this mod already had a
# release today (Africa/Tunis day), on Modrinth, CurseForge or an earlier Publish run. A dry run only reports it.
# It runs before building and again right before the upload, whatever the inputs below say.
#
# Repo secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN, CURSEFORGE_API_KEY
# Repo variables: MODRINTH_ID (B3cmf35A), CURSEFORGE_ID (1305455); the workflow falls back to these IDs if the variables are unset
#
# Prove it first:  gh workflow run publish.yml -f version=2.0.2 -f dry_run=true
# Release:         gh workflow run publish.yml -f version=2.0.3   (or: git tag v2.0.3 && git push origin v2.0.3)

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging; matches jar names / GitHub Release
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"
      minecraft_version:
        description: "Optional: upload only this Minecraft version's jars (1.20.1, 1.21.1, 26.2 or 26.3); the same-day guard still applies"
        required: false
      update_listing:
        description: "Also update the Modrinth description, summary and icon from marketing/ (true/false)"
        required: false
        default: "false"

# One Publish at a time per repo, so two runs can't both pass the same-day guard.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$VERSION_INPUT" ]]; then
            echo "version=${VERSION_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - name: Check VERSION file
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          file_version=$(tr -d '[:space:]' < VERSION)
          if [[ "$file_version" != "$VERSION" ]]; then
            echo "::error::VERSION file is $file_version, requested $VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test publisher scripts
        run: node --test scripts/*.test.mjs

      - name: Same-day guard
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID || 'B3cmf35A' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1305455' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Find prebuilt release jars
        id: prebuilt
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Only the 8 convention names are ever picked up; anything else for this version is ignored.
          mapfile -t NAMES < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          found=0
          for name in "${NAMES[@]}"; do
            if [ -f "releases/$name" ]; then
              cp -f "releases/$name" dist/
              found=$((found + 1))
            fi
          done
          if [ "$found" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $found prebuilt jar(s) from releases/"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No convention jars for ${VERSION} in releases/; will try the GitHub Release, then build from source"
          fi

      - name: Download GitHub release jars
        id: ghrelease
        if: steps.prebuilt.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          patterns=()
          while IFS= read -r name; do patterns+=(--pattern "$name"); done < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "v${VERSION}" --repo "${{ github.repository }}" --dir dist --clobber "${patterns[@]}" || true
          fi
          count=$(find dist -maxdepth 1 -name 'better_with_gold-*.jar' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $count jar(s) from GitHub Release v${VERSION}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub Release jars for v${VERSION}; building from source"
          fi

      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root build hands 26.x
      # JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'

      - name: Build from source
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Also fails if VERSION differs from the workspaces.
          python3 scripts/check_targets.py workspaces
          ws_version="$(python3 scripts/check_targets.py version)"
          if [ "$ws_version" != "$VERSION" ]; then
            echo "::error::The workspaces are at ${ws_version}, not ${VERSION}. Bump them first (./gradlew syncVersion -PmodVersion=${VERSION})."
            exit 1
          fi
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon
          python3 scripts/check_targets.py jars --version "$VERSION" --dir releases --list-file built-jars.txt
          mkdir -p dist
          xargs -a built-jars.txt cp -f -t dist/

      - name: Verify release jars
        id: jars
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MC_FILTER: ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail
          # Exactly the 8 convention jars, one per loader + Minecraft pair, or the run stops here.
          python3 scripts/check_targets.py jars --version "$VERSION" --dir dist --list-file jar-list.txt
          mapfile -t JARS < jar-list.txt
          # Each jar carries its loader's metadata, as the upload step expects from its name.
          for jar in "${JARS[@]}"; do
            case "$(basename "$jar")" in
              better_with_gold-fabric-*) meta='fabric.mod.json' ;;
              better_with_gold-neoforge-*) meta='META-INF/neoforge.mods.toml' ;;
              better_with_gold-forge-*) meta='META-INF/mods.toml' ;;
            esac
            unzip -l "$jar" | grep " ${meta}\$" >/dev/null || { echo "::error::Missing ${meta} in ${jar}"; exit 1; }
          done
          if [ -n "$MC_FILTER" ]; then
            case "$MC_FILTER" in
              1.20.1|1.21.1|26.2|26.3) ;;
              *) echo "::error::minecraft_version must be 1.20.1, 1.21.1, 26.2 or 26.3, not ${MC_FILTER}"; exit 1 ;;
            esac
            FILTERED=()
            for jar in "${JARS[@]}"; do
              if [[ "$(basename "$jar")" == better_with_gold-*-"${MC_FILTER}"-"${VERSION}".jar ]]; then
                FILTERED+=("$jar")
              fi
            done
            JARS=("${FILTERED[@]}")
            echo "Uploading only Minecraft ${MC_FILTER}:"
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*.jar

      - name: Same-day guard (again, right before upload)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID || 'B3cmf35A' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1305455' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID || 'B3cmf35A' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1305455' }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map((s) => s.trim()).filter(Boolean);
          const LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150 };

          function parseJar(jarPath) {
            const name = path.basename(jarPath);
            const m = name.match(/^better_with_gold-(fabric|forge|neoforge)-(.+)-(\d+\.\d+\.\d+)\.jar$/i);
            if (!m) throw new Error('Cannot parse jar name: ' + name);
            return {
              jar: jarPath,
              name,
              loader: m[1].toLowerCase(),
              game: m[2],
              modVersion: m[3],
            };
          }

          (async () => {
            const parsed = jars.map(parseJar);
            const notes = path.join('patchnotes', `${version}.md`);
            const changelog = fs.existsSync(notes) ? fs.readFileSync(notes, 'utf8') : `Release ${version}`;

            for (const parsedJar of parsed) {
              const body = {
                name: `Remnants | Fellowship ${version} · ${parsedJar.loader} · ${parsedJar.game}`,
                version_number: `${version}+${parsedJar.loader}-${parsedJar.game}`,
                changelog,
                dependencies: parsedJar.loader === 'fabric' ? [{ project_id: 'P7dR8mSH', dependency_type: 'required' }] : [],
                game_versions: [parsedJar.game],
                version_type: 'release',
                loaders: [parsedJar.loader],
                featured: false,
                status: 'listed',
                project_id: process.env.MODRINTH_ID,
                file_parts: ['file_0'],
                primary_file: 'file_0',
              };
              const form = new FormData();
              form.append('data', JSON.stringify(body));
              form.append('file_0', new Blob([fs.readFileSync(parsedJar.jar)]), parsedJar.name);
              const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                method: 'POST',
                headers: { Authorization: process.env.MODRINTH_TOKEN },
                body: form,
              });
              const mrText = await mrRes.text();
              if (!mrRes.ok) {
                throw new Error('Modrinth ' + mrRes.status + ' ' + parsedJar.name + ' ' + mrText.slice(0, 500));
              }
              console.log('Modrinth OK', body.version_number, parsedJar.name);
            }

            const legacyPayload = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            }).then((r) => r.json());
            const legacyFlat = Array.isArray(legacyPayload) ? legacyPayload : legacyPayload?.data || [];
            const clientId = legacyFlat.find((v) => v.name === 'Client')?.id;
            const serverId = legacyFlat.find((v) => v.name === 'Server')?.id;
            if (!clientId || !serverId) throw new Error('CurseForge Client/Server version ids missing');

            for (const parsedJar of parsed) {
              const loaderId = LOADER_IDS[parsedJar.loader];
              if (!loaderId) throw new Error('Unknown loader ' + parsedJar.loader);
              const gameHit = legacyFlat.find((v) => v.name === parsedJar.game);
              if (!gameHit) throw new Error('No CurseForge game version for ' + parsedJar.game);
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: `Remnants | Fellowship ${version} · ${parsedJar.loader} · ${parsedJar.game}`,
                gameVersions: [clientId, serverId, loaderId, gameHit.id],
                releaseType: 'release',
                ...(parsedJar.loader === 'fabric' ? { relations: { projects: [{ slug: 'fabric-api', type: 'requiredDependency' }] } } : {}),
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(parsedJar.jar)]), parsedJar.name);
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) {
                throw new Error('CurseForge ' + cfRes.status + ' ' + parsedJar.name + ' ' + cfText.slice(0, 500));
              }
              console.log('CurseForge OK', meta.displayName, parsedJar.name);
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE

      # CurseForge has no API for the project description: paste marketing/curseforge/description.md there by hand.
      - name: Update Modrinth listing
        if: ${{ inputs.update_listing == 'true' && inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID || 'B3cmf35A' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const headers = { Authorization: process.env.MODRINTH_TOKEN };
            const project = `https://api.modrinth.com/v2/project/${process.env.MODRINTH_ID}`;
            const body = fs.readFileSync('marketing/modrinth/description.md', 'utf8');
            const description = fs.readFileSync('marketing/modrinth/summary.txt', 'utf8').trim();
            const res = await fetch(project, {
              method: 'PATCH',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ body, description }),
            });
            if (!res.ok) throw new Error('Modrinth listing ' + res.status + ' ' + (await res.text()).slice(0, 300));
            console.log('Modrinth description and summary updated');
            const icon = await fetch(`${project}/icon?ext=png`, {
              method: 'PATCH',
              headers: { ...headers, 'Content-Type': 'image/png' },
              body: fs.readFileSync('marketing/images/icon.png'),
            });
            if (!icon.ok) throw new Error('Modrinth icon ' + icon.status + ' ' + (await icon.text()).slice(0, 300));
            console.log('Modrinth icon updated');
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
